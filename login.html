<!DOCTYPE html>
<html lang="ko" data-theme="default">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그인 - 달란트 마을</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⭐</text></svg>" />
  <link rel="stylesheet" href="css/themes.css" />
  <link rel="stylesheet" href="css/admin.css" />
  <style>
    .login-wrapper { background: linear-gradient(135deg, #f8f5ff 0%, #e8e0ff 50%, #fce4ec 100%); }
    .login-card { max-width: 400px; }
    .login-title { font-size: 1.6rem; }
    .login-role-info { text-align: center; font-size: 0.78rem; color: var(--admin-text-muted); margin-top: 1.2rem; padding-top: 1rem; border-top: 1px solid var(--admin-border); }
    .back-home { display: block; text-align: center; margin-top: 1rem; font-size: 0.85rem; color: var(--admin-primary); text-decoration: none; }
    .back-home:hover { text-decoration: underline; }
    .remember-row { display: flex; align-items: center; justify-content: space-between; gap: 0.8rem; margin: -0.2rem 0 1rem; }
    .remember-label { display: inline-flex; align-items: center; gap: 0.45rem; font-size: 0.84rem; font-weight: 600; color: var(--admin-text-muted); cursor: pointer; user-select: none; }
    .remember-label input { width: 16px; height: 16px; accent-color: var(--admin-primary); cursor: pointer; }
  </style>
</head>
<body class="admin-body">
  <div class="login-wrapper">
    <div class="login-card">
      <div style="text-align:center;font-size:2.5rem;margin-bottom:0.5rem;">⭐</div>
      <div class="login-title">달란트 마을 로그인</div>
      <p class="login-sub">아이디와 비밀번호를 입력해주세요</p>

      <div class="form-error" id="errorMsg"></div>

      <form id="loginForm" onsubmit="return false;">
        <div class="form-group">
          <label for="username">아이디</label>
          <input type="text" id="username" placeholder="아이디 입력" autocomplete="username" required />
        </div>
        <div class="form-group">
          <label for="password">비밀번호</label>
          <input type="password" id="password" placeholder="비밀번호 입력" autocomplete="current-password" required />
        </div>
        <div class="remember-row">
          <label class="remember-label" for="rememberUsername">
            <input type="checkbox" id="rememberUsername" />
            <span>아이디 저장</span>
          </label>
        </div>
        <button type="submit" class="btn-primary" id="btnLogin">로그인</button>
      </form>

      <div style="text-align:center;margin-top:1.2rem;padding-top:1rem;border-top:1px solid var(--admin-border);">
        <a href="register.html" style="display:inline-block;padding:0.5rem 1.5rem;background:linear-gradient(135deg,#51cf66,#40c057);color:#fff;border-radius:50px;text-decoration:none;font-weight:700;font-size:0.9rem;transition:all 0.2s;">📝 계정 등록 신청</a>
        <div style="font-size:0.75rem;color:var(--admin-text-muted);margin-top:0.5rem;">계정이 없으신가요? 신청 후 관리자 승인을 받으면 이용 가능합니다</div>
      </div>
      <div style="display:flex;justify-content:center;gap:1.2rem;margin-top:1rem;font-size:0.85rem;">
        <a href="index.html" class="back-home" style="margin:0;">← 메인 페이지</a>
        <a href="guide.html" class="back-home" style="margin:0;">📖 사용 가이드</a>
      </div>
    </div>
  </div>

  <script crossorigin="anonymous" src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.109.0"></script>
  <script src="config/public-config.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/activity-log.js"></script>
  <script src="js/codes.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/theme.js"></script>
  <script>
    const SAVED_USERNAME_KEY = 'cho_saved_username';

    initSupabase();

    function getLoginRedirectTarget() {
      return typeof getRedirectTargetFromQuery === 'function' ? getRedirectTargetFromQuery(null) : null;
    }

    function getPostLoginTarget(session) {
      const redirectTarget = getLoginRedirectTarget();
      if (session && session.isFirstLogin) {
        const fallbackTarget = getRoleRedirectUrl(session.permissionLevel, '');
        const changePwUrl = typeof buildUrlWithRedirect === 'function'
          ? buildUrlWithRedirect('admin/change-password.html', redirectTarget || fallbackTarget)
          : 'admin/change-password.html';
        return changePwUrl;
      }
      if (redirectTarget) return redirectTarget;
      return getRoleRedirectUrl(session.permissionLevel, '');
    }

    function normalizeRegistrationApprovalInfo(data, fallbackStatus) {
      let info = data || {};
      if (typeof info === 'string') {
        try { info = JSON.parse(info); }
        catch (e) { info = { status: info }; }
      }
      const managers = info.managers || info.contacts || info.admins || [];
      return {
        status: info.status || fallbackStatus || 'not_found',
        departmentName: info.departmentName || info.department_name || '',
        managers: Array.isArray(managers) ? managers.filter(Boolean) : []
      };
    }

    function escapeHtml(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    async function fetchRegistrationApprovalInfo(username) {
      try {
        const { data, error } = await _sb.rpc('get_registration_approval_contact', { p_username: username });
        if (!error && data) return normalizeRegistrationApprovalInfo(data);
      } catch (e) {}

      let status = 'not_found';
      try {
        const { data: rpcResult } = await _sb.rpc('check_registration_status', { p_username: username });
        if (rpcResult) status = rpcResult;
      } catch (e) {}
      return normalizeRegistrationApprovalInfo(null, status);
    }

    function renderPendingApprovalMessage(info) {
      const deptLine = info.departmentName
        ? `<div style="font-size:0.8rem;color:#636e72;margin-top:0.35rem;">신청 부서: ${escapeHtml(info.departmentName)}</div>`
        : '';
      const managerLine = info.managers.length
        ? info.managers.map(escapeHtml).join(', ')
        : '표시할 담당 관리자 정보가 없습니다.';
      return `<div style="text-align:left;line-height:1.5;">
        <div style="display:flex;align-items:flex-start;gap:0.6rem;justify-content:center;text-align:left;">
          <span style="font-size:1.6rem;">&#9203;</span>
          <div>
            <strong>가입 승인 되지 않은 계정입니다.</strong><br>
            <span style="font-size:0.85rem;color:#636e72;">관리자에게 문의하여 주세요.</span>
            ${deptLine}
            <div style="margin-top:0.5rem;padding:0.5rem 0.65rem;border-radius:8px;background:var(--t-subtle-surface,#f8f9fa);font-size:0.8rem;">
              <strong>관리자 정보</strong><br>${managerLine}
            </div>
          </div>
        </div>
      </div>`;
    }

    (async () => {
      const savedUsername = localStorage.getItem(SAVED_USERNAME_KEY) || '';
      const usernameInput = document.getElementById('username');
      const rememberInput = document.getElementById('rememberUsername');
      const passwordInput = document.getElementById('password');
      if (savedUsername) {
        usernameInput.value = savedUsername;
        rememberInput.checked = true;
        passwordInput.focus();
      }

      const session = await loadAuthSession();
      if (session) {
        window.location.href = getPostLoginTarget(session);
        return;
      }

      document.getElementById('loginForm').addEventListener('submit', async () => {
        const btn = document.getElementById('btnLogin');
        const errEl = document.getElementById('errorMsg');
        errEl.classList.remove('show');
        btn.disabled = true;
        btn.textContent = '로그인 중...';

        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        if (!rememberInput.checked) {
          localStorage.removeItem(SAVED_USERNAME_KEY);
        }

        const regInfo = await fetchRegistrationApprovalInfo(username);
        if (regInfo.status === 'pending') {
          await logInfo('LOGIN_PENDING_APPROVAL', { username, departmentName: regInfo.departmentName, managers: regInfo.managers });
          errEl.innerHTML = renderPendingApprovalMessage(regInfo);
          errEl.classList.add('show');
          btn.disabled = false;
          btn.textContent = '로그인';
          return;
        }
        if (regInfo.status === 'rejected') {
          errEl.innerHTML = '<div style="display:flex;align-items:center;gap:0.6rem;justify-content:center;"><span style="font-size:1.6rem;">&#10060;</span><div><strong>가입 신청이 거부되었어요</strong><br><span style="font-size:0.8rem;color:#636e72;">자세한 내용은 관리자에게 문의해주세요</span></div></div>';
          errEl.classList.add('show');
          btn.disabled = false;
          btn.textContent = '로그인';
          return;
        }

        const result = await login(username, password);

        if (result.success) {
          if (rememberInput.checked) {
            localStorage.setItem(SAVED_USERNAME_KEY, username);
          } else {
            localStorage.removeItem(SAVED_USERNAME_KEY);
          }
          window.location.href = getPostLoginTarget({
            isFirstLogin: !!result.data.is_first_login,
            permissionLevel: result.data.permission_level || result.data.permissionLevel || 'teacher'
          });
        } else {
          if (regInfo.status === 'approved') {
            errEl.innerHTML = '<span style="font-size:1.1rem;">&#128274;</span> 비밀번호가 일치하지 않습니다.';
          } else {
            errEl.innerHTML = '<span style="font-size:1.1rem;">&#128274;</span> 아이디 또는 비밀번호가 일치하지 않습니다.';
          }
          errEl.classList.add('show');
          btn.disabled = false;
          btn.textContent = '로그인';
        }
      });
    })();
  </script>
  <div id="version-container"></div>
  <script src="js/version.js"></script>
</body>
</html>
