<!DOCTYPE html>
<html lang="ko" data-theme="default">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>달란트 적립 방법 - 달란트 마을</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>" />
  <link rel="stylesheet" href="css/themes.css" />
  <link rel="stylesheet" href="css/common.css" />
  <style>
    .earn-hero { text-align: center; margin-bottom: 2rem; }
    .earn-hero-icon { font-size: 4rem; margin-bottom: 0.5rem; }
    .earn-hero h1 { font-size: 2rem; font-weight: 900; color: var(--primary); margin-bottom: 0.5rem; }
    .earn-hero p { color: #636e72; font-size: 1.05rem; }

    .method-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 1rem;
      margin-bottom: 2rem;
    }
    @media (max-width: 768px) {
      .method-grid { grid-template-columns: repeat(3, 1fr); gap: 0.6rem; }
      .method-card { padding: 1rem 0.6rem; }
      .method-card .m-icon { font-size: 2rem; margin-bottom: 0.4rem; }
      .method-card h3 { font-size: 0.85rem; }
      .method-card .m-talent { font-size: 0.7rem; padding: 0.15rem 0.5rem; }
      .method-card p { font-size: 0.72rem; line-height: 1.4; }
    }

    .method-card {
      background: #fff;
      border-radius: 20px;
      padding: 2rem 1.5rem;
      box-shadow: 0 4px 20px rgba(108, 92, 231, 0.08);
      border: 2px solid transparent;
      transition: transform 0.3s, box-shadow 0.3s, border-color 0.3s;
      text-align: center;
    }
    .method-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 30px rgba(108, 92, 231, 0.15);
    }

    .method-card .m-icon { font-size: 3rem; margin-bottom: 0.8rem; display: block; }
    .method-card h3 { font-size: 1.15rem; font-weight: 800; color: var(--primary); margin-bottom: 0.4rem; }
    .method-card .m-talent {
      display: inline-block;
      background: linear-gradient(135deg, #fdcb6e, #f39c12);
      color: #fff;
      font-weight: 800;
      font-size: 0.9rem;
      padding: 0.25rem 0.8rem;
      border-radius: 50px;
      margin: 0.5rem 0;
    }
    .method-card .m-amount {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 28px;
      margin: 0 0 0.55rem;
      padding: 0.2rem 0.75rem;
      border-radius: 999px;
      background: rgba(108, 92, 231, 0.1);
      color: var(--c-primary);
      border: 1px solid rgba(108, 92, 231, 0.22);
      font-size: 0.82rem;
      font-weight: 900;
    }
    .method-card .m-amount.missing {
      color: var(--c-text-muted);
      background: var(--t-subtle-surface, #f8f9fa);
      border-color: var(--c-border);
      font-weight: 700;
    }
    .method-card p { color: #636e72; font-size: 0.92rem; line-height: 1.6; white-space: pre-line; }

    .method-empty {
      grid-column: 1 / -1;
      margin: 0;
      padding: 2rem 1rem;
      border: 1px dashed var(--border);
      border-radius: 14px;
      color: #636e72;
      text-align: center;
    }

    .method-card:nth-child(1) { border-color: #fdcb6e; }
    .method-card:nth-child(2) { border-color: #55efc4; }
    .method-card:nth-child(3) { border-color: #74b9ff; }
    .method-card:nth-child(4) { border-color: #fd79a8; }
    .method-card:nth-child(5) { border-color: #a29bfe; }
    .method-card:nth-child(6) { border-color: #ffeaa7; }

    .tip-box {
      background: linear-gradient(135deg, #a29bfe22, #fd79a822);
      border-radius: 16px;
      padding: 1.5rem 2rem;
      border: 2px dashed var(--primary);
      text-align: center;
    }
    .tip-box h3 { font-size: 1.1rem; color: var(--primary); margin-bottom: 0.5rem; }
    .tip-box p { color: #636e72; font-size: 0.95rem; line-height: 1.7; }
  </style>
</head>
<body class="page-body">
  <div id="nav-container"></div>


  <div class="page-container">
    <div class="earn-hero">
      <div class="earn-hero-icon">💰</div>
      <h1>달란트 적립 방법</h1>
      <p>다양한 활동으로 달란트를 모아 보세요!</p>
    </div>

    <div id="earnTabBar" style="display:flex;gap:0.5rem;margin-bottom:1.2rem;justify-content:center;">
      <button class="filter-btn active" id="earnTabStudent" onclick="switchEarnTab('student')" style="padding:0.5rem 1.2rem;font-size:0.95rem;">🎒 학생</button>
      <button class="filter-btn" id="earnTabTeacher" onclick="switchEarnTab('teacher')" style="padding:0.5rem 1.2rem;font-size:0.95rem;display:none;">👩‍🏫 교사</button>
    </div>

    <div class="method-grid" id="earnStudentGrid" aria-live="polite"></div>

    <div class="method-grid" id="earnTeacherGrid" style="display:none;" aria-live="polite"></div>

    <div class="tip-box">
      <h3>💡 달란트 적립 TIP!</h3>
      <p>
        달란트 항목과 금액은 선생님이 정한 설정에 따라 달라질 수 있어요.<br/>
        열심히 활동하고 선생님께 확인받으면 내 달란트에 쌓여요!<br/>
        모은 달란트는 <strong>달란트 상점</strong>에서 원하는 상품과 교환할 수 있어요! 🎁
      </p>
    </div>
  </div>

  <script>
    function switchEarnTab(tab) {
      document.getElementById('earnTabStudent').classList.toggle('active', tab === 'student');
      document.getElementById('earnTabTeacher').classList.toggle('active', tab === 'teacher');
      document.getElementById('earnStudentGrid').style.display = tab === 'student' ? '' : 'none';
      document.getElementById('earnTeacherGrid').style.display = tab === 'teacher' ? '' : 'none';
    }
  </script>

  <footer class="page-footer">
    <p>초등부 달란트 관리 &copy; 2026 CHO-Talents</p>
  </footer>

  <script crossorigin="anonymous" src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.109.0"></script>
  <script src="config/public-config.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/activity-log.js"></script>
  <script src="js/codes.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/talent.js"></script>
  <script>
    initSupabase();
    autoLogPageView();

    (async () => {
      await navInit();
      const session = await loadAuthSession();
      if (session) navUpdateAuth(session);
      await initTheme();
      if (session && session.permissionRank >= 40) {
        document.getElementById('earnTabTeacher').style.display = '';
      }
      switchEarnTab(session && session.userType === 'teacher' ? 'teacher' : 'student');
      await loadEarnTalentAmounts();
    })();

    const DEFAULT_TALENT_EMOJI = '✨';

    function createTalentCard(item) {
      const card = document.createElement('article');
      card.className = 'method-card';

      const icon = document.createElement('span');
      icon.className = 'm-icon';
      icon.textContent = String(item.emoji || '').trim() || DEFAULT_TALENT_EMOJI;

      const name = document.createElement('h3');
      name.textContent = item.name || '이름 없는 항목';

      const rule = document.createElement('span');
      rule.className = 'm-talent';
      rule.textContent = item.giving_rule || '선생님 확인 후 지급';

      const amount = document.createElement('span');
      amount.className = 'm-amount';
      amount.textContent = `+${Number(item.talent_amount || 0).toLocaleString()} 달란트`;

      const description = document.createElement('p');
      description.textContent = item.giving_description || '활동을 완료하면 달란트를 받을 수 있어요!';

      card.append(icon, name, rule, amount, description);
      return card;
    }

    function renderEarnTalentItems(gridId, items, error) {
      const grid = document.getElementById(gridId);
      if (!grid) return;
      grid.replaceChildren();

      const message = document.createElement('p');
      message.className = 'method-empty';
      if (error) {
        message.textContent = '달란트 항목을 불러오지 못했어요. 잠시 후 다시 시도해주세요.';
        grid.append(message);
        return;
      }
      if (!items || items.length === 0) {
        message.textContent = '현재 표시할 활성 달란트 항목이 없습니다.';
        grid.append(message);
        return;
      }

      const cards = document.createDocumentFragment();
      items.forEach(item => cards.append(createTalentCard(item)));
      grid.append(cards);
    }

    async function loadEarnTalentItems(targetType, gridId) {
      const { data, error } = await fetchTalentItems(targetType);
      renderEarnTalentItems(gridId, data || [], error);
    }

    async function loadEarnTalentAmounts() {
      if (!_sb || typeof fetchTalentItems !== 'function') {
        renderEarnTalentItems('earnStudentGrid', [], true);
        renderEarnTalentItems('earnTeacherGrid', [], true);
        return;
      }
      await Promise.all([
        loadEarnTalentItems('student', 'earnStudentGrid'),
        loadEarnTalentItems('teacher', 'earnTeacherGrid')
      ]);
    }
  </script>
  <div id="version-container"></div>
  <script src="js/version.js"></script>
</body>
</html>
